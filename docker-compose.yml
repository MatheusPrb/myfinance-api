services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myfinance

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - myfinance

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-myfinance}
      POSTGRES_USER: ${DB_USERNAME:-myfinance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-myfinance} -d ${DB_DATABASE:-myfinance}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myfinance

volumes:
  postgres_data:

networks:
  myfinance:
    driver: bridge

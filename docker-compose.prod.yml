name: myfinance-prod

services:
  api:
    image: ghcr.io/MatheusPrb/myfinance-api:${API_IMAGE_TAG:-latest}
    container_name: myfinance_prod_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myfinance_prod

  nginx:
    image: nginx:1.27-alpine
    container_name: myfinance_prod_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../myfinance-app/dist:/var/www/frontend:ro
      - ./:/var/www/html:ro
    depends_on:
      - api
    networks:
      - myfinance_prod

  postgres:
    image: postgres:16-alpine
    container_name: myfinance_prod_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - myfinance_prod

volumes:
  postgres_prod_data:

networks:
  myfinance_prod:
    driver: bridge

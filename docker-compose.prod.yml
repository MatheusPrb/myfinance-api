name: myfinance-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: app
    image: myfinance-api-app:${IMAGE_TAG:-prod}
    container_name: myfinance_prod_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS_ON_START: "1"
      RUN_ARTISAN_OPTIMIZE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myfinance_prod
    volumes:
      - app_storage:/var/www/html/storage

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web
    image: myfinance-api-nginx:${IMAGE_TAG:-prod}
    container_name: myfinance_prod_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - app
    networks:
      - myfinance_prod

  postgres:
    image: postgres:16-alpine
    container_name: myfinance_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - myfinance_prod

volumes:
  app_storage:
  postgres_prod_data:

networks:
  myfinance_prod:
    driver: bridge

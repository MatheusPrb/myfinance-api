name: myfinance-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: myfinance-api-app:${IMAGE_TAG:-prod}
    container_name: myfinance_prod_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS_ON_START: "1"
      RUN_ARTISAN_OPTIMIZE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myfinance_prod

  frontend:
    build:
      context: ../myfinance-app
      dockerfile: Dockerfile.production
      args:
        VITE_API_URL: ""
    image: myfinance-front:${IMAGE_TAG:-prod}
    container_name: myfinance_prod_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - myfinance_prod

  nginx:
    image: nginx:1.27-alpine
    container_name: myfinance_prod_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
    depends_on:
      - api
      - frontend
    networks:
      - myfinance_prod

  postgres:
    image: postgres:16-alpine
    container_name: myfinance_prod_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - myfinance_prod

volumes:
  postgres_prod_data:

networks:
  myfinance_prod:
    driver: bridge

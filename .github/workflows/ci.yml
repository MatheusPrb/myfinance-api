name: Backend CI/CD

on:
  push:
  pull_request:

concurrency:
  group: myfinance-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: matheusprb/myfinance-api

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Análise e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist

      - name: Preparar o ambiente
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Gerar chave da aplicação
        run: php artisan key:generate

      - name: Executar análise estática
        run: composer analyse

      - name: Executar testes
        run: php artisan test

  publish:
    name: Construir e publicar imagem
    needs: quality

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy produção
    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configurar chave SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Registrar host da VPS
        run: |
          ssh-keyscan \
            -p "${{ secrets.PROD_SSH_PORT }}" \
            -H "${{ secrets.PROD_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Executar deploy na VPS
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.PROD_SSH_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "cd /opt/projects/myfinance-api && ./deploy.sh '${{ github.sha }}'"
